<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Congratulazioni - Stanze dell'Io</title>

    <style>
      :root {
        --bg-dark: #0d0b08;
        --gold: #f4c76b;
        --orange: #ff7a18;
        --cream: #fff5df;
        --glass: rgba(12, 10, 8, 0.72);
        --border: rgba(255, 230, 170, 0.35);
        --text-soft: rgba(255, 255, 255, 0.78);
        --shadow: 0 24px 80px rgba(0, 0, 0, 0.62);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        font-family: Georgia, "Times New Roman", serif;
        color: white;
        background:
          radial-gradient(
            circle at 50% 30%,
            rgba(244, 199, 107, 0.25),
            transparent 45%
          ),
          radial-gradient(
            circle at 18% 18%,
            rgba(255, 125, 24, 0.35),
            transparent 28%
          ),
          linear-gradient(
            135deg,
            #150d08 0%,
            #4a2912 35%,
            #8a6d32 70%,
            #0f0f0f 100%
          );
        background-size: 140% 140%;
        animation: sfondoPremio 12s ease-in-out infinite alternate;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
      }

      @keyframes sfondoPremio {
        from { background-position: 0% 0%; }
        to { background-position: 100% 100%; }
      }

      .prize-card {
        width: min(100%, 620px);
        padding: clamp(30px, 6vw, 60px);
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 32px;
        backdrop-filter: blur(20px);
        box-shadow: 
          var(--shadow),
          0 0 60px rgba(244, 199, 107, 0.15);
        text-align: center;
        position: relative;
        isolation: isolate;
        animation: comparsa 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      @keyframes comparsa {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .icon-glow {
        font-size: clamp(4rem, 10vw, 5.5rem);
        color: var(--gold);
        text-shadow: 
          0 0 20px rgba(244, 199, 107, 0.6),
          0 0 40px rgba(255, 122, 24, 0.4);
        margin-bottom: 20px;
        display: inline-block;
        animation: fluttua 4s ease-in-out infinite alternate;
      }

      @keyframes fluttua {
        from { transform: translateY(0) scale(1); }
        to { transform: translateY(-12px) scale(1.05); }
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3.2rem);
        font-weight: 400;
        letter-spacing: 4px;
        color: #white;
        text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        margin-bottom: 24px;
        line-height: 1.2;
      }

      .message {
        font-size: clamp(1rem, 2.5vw, 1.25rem);
        color: var(--text-soft);
        line-height: 1.7;
        margin-bottom: 40px;
        font-style: italic;
      }

      .message strong {
        color: var(--gold);
        font-weight: 400;
        font-style: normal;
        letter-spacing: 1px;
      }

      .btn-premio {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 12px 36px;
        border-radius: 999px;
        border: 1px solid var(--gold);
        background: linear-gradient(135deg, rgba(255,122,24,0.15), rgba(244,199,107,0.15));
        color: white;
        font-family: inherit;
        font-size: 1rem;
        letter-spacing: 2px;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }

      .btn-premio:hover {
        transform: translateY(-3px);
        background: linear-gradient(135deg, var(--orange), var(--gold));
        color: #0d0b08;
        box-shadow: 
          0 15px 40px rgba(255, 122, 24, 0.3),
          0 0 20px rgba(244, 199, 107, 0.4);
      }

      /* Effetto scintille in background statiche/eleganti */
      .sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: var(--gold);
        border-radius: 50%;
        opacity: 0.3;
      }
      .s1 { top: 15%; left: 15%; }
      .s2 { top: 25%; right: 20%; width: 6px; height: 6px; }
      .s3 { bottom: 20%; left: 25%; }
      .s4 { bottom: 15%; right: 15%; }
    </style>
  </head>
  <body>

    <div class="prize-card">
      <div class="sparkle s1"></div>
      <div class="sparkle s2"></div>
      <div class="sparkle s3"></div>
      <div class="sparkle s4"></div>

      <div class="icon-glow">✦</div>
      
      <h1>!!!CONGRATULAZIONI!!!</h1>
      
      <p class="message">
        Hai superato le soglie, attraversato le visioni e decifrato i percorsi della galleria.<br>
        <strong>La Stanza Segreta dell'Io è finalmente aperta.</strong><br>
        Hai dimostrato curiosità e intuito nel viaggio attraverso la tua stessa mente.
      </p>

      <a href="index.html" class="btn-premio">Ritorna al Portone</a>
    </div>

  </body>
</html>
